# =============================================================================
# Wayfire configuration
#
# Profiles are controlled by ~/.local/bin/wayfire-toggle-perf
#
# LIGHT  = gaming / lowest compositor overhead
# NORMAL = daily work
# FULL   = visual effects / unixporn
#
# The toggle script changes ONLY [core] plugins.
# All plugin configuration stays here so there is one source of truth.
# =============================================================================


[input]
xkb_layout = us,ir
xkb_variant = ,winkeys
xkb_options = grp:win_space_toggle
cursor_size = 32


[core]
# The profile selector modifies ONLY this list.
#
# Current default: NORMAL
plugins = \
  alpha \
  autostart \
  command \
  decoration \
  expo \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions

xwayland = true
close_top_view = <super> KEY_Q | <alt> KEY_F4

# 4 × 1 workspaces
vwidth = 4
vheight = 1

preferred_decoration_mode = client


# =============================================================================
# BASIC WINDOW CONTROL
# =============================================================================

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT


# =============================================================================
# VISUAL / OPTIONAL PLUGINS
#
# These sections intentionally remain in the single config even when their
# plugin is disabled. Wayfire simply won't load them unless they are present
# in [core] plugins.
# =============================================================================

[zoom]
modifier = <super>

[alpha]
modifier = <super> <alt>

[wrot]
activate = <super> <ctrl> BTN_RIGHT

[fisheye]
toggle = <super> <ctrl> KEY_F


# =============================================================================
# SESSION / AUTOSTART
# =============================================================================

[autostart]
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY

autostart_wf_shell = false

background = awww-daemon
panel = waybar
outputs = kanshi
notifications = mako
gamma = wlsunset
idle = swayidle before-sleep swaylock

portal = /usr/libexec/xdg-desktop-portal


# =============================================================================
# COMMANDS
# =============================================================================

[command]

# Browser
binding_qute = <super> KEY_W
command_qute = qutebrowser

# Terminal
binding_terminal = <super> KEY_ENTER
command_terminal = alacritty

# Profile selector
binding_perf = <super> <shift> KEY_P
command_perf = wayfire-toggle-perf

# Launcher
binding_launcher = <super>
command_launcher = rofi -show drun

# Lock
binding_lock = <super> KEY_L
command_lock = swaylock

# Logout
binding_logout = <super> KEY_M
command_logout = wlogout

# File manager
binding_pcmanfm = <super> KEY_E
command_pcmanfm = pcmanfm

# Screenshot
binding_screenshot = KEY_PRINT
command_screenshot = grim $(date '+%F_%T').webp

binding_screenshot_interactive = <shift> KEY_PRINT
command_screenshot_interactive = slurp | grim -g - $(date '+%F_%T').webp

# Volume
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = amixer set Master 5%+

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = amixer set Master 5%-

binding_mute = KEY_MUTE
command_mute = amixer set Master toggle

# Brightness
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = light -A 5

repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = light -U 5

# Display configuration
command_display = wdisplays
binding_display = <super> KEY_P

# Quick Display configuration
command_quick = wayfire-change-screen
binding_quick = <super> <ctrl> KEY_P

# Wallpaper Selector
command_wallpaper = change-background
binding_wallpaper = <super> <ctrl> KEY_W


# =============================================================================
# GRID
# =============================================================================

[grid]

slot_bl = <super> KEY_KP1
slot_b  = <super> KEY_KP2
slot_br = <super> KEY_KP3

slot_l = <super> KEY_LEFT  | <super> KEY_KP4
slot_c = <super> KEY_UP    | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6

slot_tl = <super> KEY_KP7
slot_t  = <super> KEY_KP8
slot_tr = <super> KEY_KP9

restore = <super> KEY_DOWN | <super> KEY_KP0


# =============================================================================
# FAST SWITCHER
# =============================================================================

[fast-switcher]
activate = <alt> KEY_ESC


# =============================================================================
# NORMAL WINDOW SWITCHER
#
# Only loaded in NORMAL/FULL.
# LIGHT intentionally does not load this plugin.
# =============================================================================

[switcher]
next_view = <super> KEY_TAB
prev_view = <super> <shift> KEY_TAB


# =============================================================================
# WORKSPACES
# =============================================================================

[vswitch]

binding_left  = <ctrl> <super> KEY_LEFT
binding_down  = <ctrl> <super> KEY_DOWN
binding_up    = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT

with_win_left  = <ctrl> <super> <shift> KEY_LEFT
with_win_down  = <ctrl> <super> <shift> KEY_DOWN
with_win_up    = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT


# =============================================================================
# CUBE
# FULL ONLY
# =============================================================================

[cube]

activate = <ctrl> <alt> BTN_LEFT

rotate_left  = <super> <ctrl> KEY_H
rotate_right = <super> <ctrl> KEY_L


# =============================================================================
# EXPO / WORKSPACE OVERVIEW
#
# Kept in LIGHT because this is actually useful, not merely eye candy.
#
# Super+O -> workspace overview
# 1..9     -> select workspace while overview is active
# =============================================================================

[expo]

toggle = <super> KEY_O

select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9


# =============================================================================
# OUTPUT SWITCHING
# =============================================================================

[oswitch]

next_output_with_win = <super> <shift> KEY_O


# =============================================================================
# INVERT
# =============================================================================

[invert]

toggle = <super> KEY_I


# =============================================================================
# WAYFIRE SHELL
# =============================================================================

[wayfire-shell]

toggle_menu = <super>


# =============================================================================
# DECORATIONS
# =============================================================================

[decoration]

active_color = 0.22 0.22 0.22 0.5
inactive_color = 0.15 0.15 0.15 0.5

border_size = 2
title_height = 22

font = JetBrainsMono Nerd Font 10

font_scale = 0.75
button_scale = 0.8
button_padding = 2

button_order = minimize close


# =============================================================================
# BLUR
# FULL ONLY
# =============================================================================

[blur]

method = kawase
degrade = 1
blur_by_default = all


# =============================================================================
# ANIMATIONS
# FULL ONLY
# =============================================================================

[animate]

open_animation = zoom
close_animation = fade

duration = 220
zoom_duration = 220


# =============================================================================
# CONFIG RELOADING
# =============================================================================

[workarounds]

# Automatically reload the config after the profile script modifies it.
auto_reload_config = true

# Small delay prevents Wayfire from reading the file halfway through a write.
config_reload_delay = 50
